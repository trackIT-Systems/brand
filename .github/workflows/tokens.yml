name: Tokens

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on broken references between tokens.
      - run: npm run build
      # Fails on approved pairs below WCAG contrast and on stale ratios in DESIGN.md.
      - run: npm run check
